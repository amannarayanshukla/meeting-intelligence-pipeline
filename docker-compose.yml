# Full stack: `docker compose up --build` → UI on http://localhost:3000, API on :3001.
# Host ports are overridable when they clash: WEB_PORT=3005 API_PORT=3002 docker compose up --build
# Host-side dev (api/web on your machine) still works with: docker compose up -d redis mongo
services:
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory-policy noeviction # BullMQ requires noeviction
    ports: ["${REDIS_PORT:-6379}:6379"]
  mongo:
    image: mongo:7
    ports: ["${MONGO_PORT:-27017}:27017"]
  api:
    build: ./api
    environment:
      PORT: 3001
      REDIS_URL: redis://redis:6379
      MONGO_URL: mongodb://mongo:27017/meetings
      CORS_ORIGIN: http://localhost:${WEB_PORT:-3000}
    ports: ["${API_PORT:-3001}:3001"]
    depends_on: [redis, mongo]
  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-3001} # baked into the bundle at build time
    ports: ["${WEB_PORT:-3000}:3000"]
    depends_on: [api]
